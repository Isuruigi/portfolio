name: Newsroom

# Rebuilds public/news-data.json every morning at 06:00 Sri Lanka time (00:30 UTC)
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  build-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build news-data.json
        run: node scripts/build-news.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- public/news-data.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news-data.json
          git commit -m "chore(news): daily newsroom refresh"
          git push
